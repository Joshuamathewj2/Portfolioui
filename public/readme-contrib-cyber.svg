<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="50%" stop-color="#0B0914"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <linearGradient id="waveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="waveArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#4F46E5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="commitWave" d="M 40 115 C 110 110, 130 62, 195 78 C 260 94, 285 45, 355 68 C 425 91, 455 38, 525 58 C 595 78, 635 32, 705 52 C 765 69, 810 28, 860 42" fill="none"/>
    <path id="snakePath" d="M 48 176 L 180 176 L 180 212 L 348 212 L 348 158 L 516 158 L 516 230 L 684 230 L 684 176 L 852 176" fill="none"/>
  </defs>

  <style>
    .hud-title { font: 800 12px 'JetBrains Mono', Consolas, monospace; fill: #F5F5F5; letter-spacing: 2.5px; }
    .hud-sub { font: 600 9px 'JetBrains Mono', Consolas, monospace; fill: #C084FC; letter-spacing: 2px; }
    .hud-stat { font: 700 10px 'JetBrains Mono', Consolas, monospace; fill: #38BDF8; letter-spacing: 1.5px; }
    .cell { rx: 3px; ry: 3px; }
    .c0 { fill: #12111A; }
    .c1 { fill: #2E1F5E; animation: p1 3.6s ease-in-out infinite; }
    .c2 { fill: #4F46E5; animation: p2 2.8s ease-in-out infinite; }
    .c3 { fill: #7C3AED; animation: p3 2.2s ease-in-out infinite; }
    .c4 { fill: #A855F7; animation: p4 1.8s ease-in-out infinite; }
    .c5 { fill: #C084FC; filter: url(#neon); animation: p5 1.5s ease-in-out infinite; }

    @keyframes p1 { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes p2 { 0%,100% { opacity: 0.7; } 50% { opacity: 1; fill: #6366F1; } }
    @keyframes p3 { 0%,100% { opacity: 0.75; } 50% { opacity: 1; fill: #9333EA; } }
    @keyframes p4 { 0%,100% { opacity: 0.8; } 50% { opacity: 1; fill: #C084FC; } }
    @keyframes p5 { 0%,100% { opacity: 0.85; } 50% { opacity: 1; fill: #38BDF8; } }

    .snake-beam {
      stroke-dasharray: 90 900;
      animation: snakeRun 4.5s linear infinite;
    }
    @keyframes snakeRun {
      from { stroke-dashoffset: 990; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Outer Card -->
  <rect width="900" height="310" rx="18" fill="url(#bg)" stroke="#27272A" stroke-width="1.5"/>

  <!-- Header Bar -->
  <g transform="translate(32, 28)">
    <circle cx="6" cy="6" r="4" fill="#a855f7" filter="url(#neon)">
      <animate attributeName="r" values="3.5;6;3.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="10" class="hud-title">PURPLE PULSE // CONTRIBUTION MATRIX &amp; VELOCITY WAVE</text>
    <text x="650" y="10" class="hud-stat">COMMIT_STREAM: ACTIVE</text>
  </g>

  <!-- ═══ TOP HALF: ANIMATED SPLINE COMMIT VELOCITY WAVE ═══ -->
  <path d="M 40 115 C 110 110, 130 62, 195 78 C 260 94, 285 45, 355 68 C 425 91, 455 38, 525 58 C 595 78, 635 32, 705 52 C 765 69, 810 28, 860 42 L 860 132 L 40 132 Z" fill="url(#waveArea)"/>
  <use href="#commitWave" stroke="url(#waveStroke)" stroke-width="3" stroke-linecap="round" filter="url(#neon)"/>

  <!-- Animated Rider Orbs on Spline Wave -->
  <circle r="5" fill="#FFFFFF" stroke="#a855f7" stroke-width="2" filter="url(#neon)">
    <animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#commitWave"/></animateMotion>
  </circle>
  <circle r="4" fill="#38BDF8" filter="url(#neon)">
    <animateMotion dur="4.2s" begin="2.1s" repeatCount="indefinite"><mpath href="#commitWave"/></animateMotion>
  </circle>

  <!-- Pulsing Peak Beacons -->
  <g filter="url(#neon)">
    <circle cx="195" cy="78" r="3.5" fill="#a855f7"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="355" cy="68" r="3.5" fill="#C084FC"><animate attributeName="r" values="3;6;3" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="525" cy="58" r="3.5" fill="#38BDF8"><animate attributeName="r" values="3;6;3" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="705" cy="52" r="3.5" fill="#a855f7"><animate attributeName="r" values="3;6;3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="42" r="4" fill="#38BDF8"><animate attributeName="r" values="3.5;7;3.5" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ═══ BOTTOM HALF: ANIMATED PURPLE CONTRIBUTION MATRIX (34 COLS x 5 ROWS) ═══ -->
  <g transform="translate(40, 150)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" width="18" height="14" class="cell c1"/><rect x="24" width="18" height="14" class="cell c2"/><rect x="48" width="18" height="14" class="cell c0"/><rect x="72" width="18" height="14" class="cell c3"/><rect x="96" width="18" height="14" class="cell c4"/><rect x="120" width="18" height="14" class="cell c2"/><rect x="144" width="18" height="14" class="cell c1"/><rect x="168" width="18" height="14" class="cell c5"/><rect x="192" width="18" height="14" class="cell c3"/><rect x="216" width="18" height="14" class="cell c2"/><rect x="240" width="18" height="14" class="cell c0"/><rect x="264" width="18" height="14" class="cell c4"/><rect x="288" width="18" height="14" class="cell c5"/><rect x="312" width="18" height="14" class="cell c3"/><rect x="336" width="18" height="14" class="cell c1"/><rect x="360" width="18" height="14" class="cell c2"/><rect x="384" width="18" height="14" class="cell c4"/><rect x="408" width="18" height="14" class="cell c5"/><rect x="432" width="18" height="14" class="cell c3"/><rect x="456" width="18" height="14" class="cell c2"/><rect x="480" width="18" height="14" class="cell c1"/><rect x="504" width="18" height="14" class="cell c4"/><rect x="528" width="18" height="14" class="cell c5"/><rect x="552" width="18" height="14" class="cell c3"/><rect x="576" width="18" height="14" class="cell c2"/><rect x="600" width="18" height="14" class="cell c4"/><rect x="624" width="18" height="14" class="cell c5"/><rect x="648" width="18" height="14" class="cell c3"/><rect x="672" width="18" height="14" class="cell c1"/><rect x="696" width="18" height="14" class="cell c4"/><rect x="720" width="18" height="14" class="cell c5"/><rect x="744" width="18" height="14" class="cell c3"/><rect x="768" width="18" height="14" class="cell c4"/><rect x="792" width="18" height="14" class="cell c5"/>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0, 18)">
      <rect x="0" width="18" height="14" class="cell c2"/><rect x="24" width="18" height="14" class="cell c4"/><rect x="48" width="18" height="14" class="cell c3"/><rect x="72" width="18" height="14" class="cell c1"/><rect x="96" width="18" height="14" class="cell c5"/><rect x="120" width="18" height="14" class="cell c3"/><rect x="144" width="18" height="14" class="cell c2"/><rect x="168" width="18" height="14" class="cell c4"/><rect x="192" width="18" height="14" class="cell c1"/><rect x="216" width="18" height="14" class="cell c3"/><rect x="240" width="18" height="14" class="cell c5"/><rect x="264" width="18" height="14" class="cell c2"/><rect x="288" width="18" height="14" class="cell c4"/><rect x="312" width="18" height="14" class="cell c5"/><rect x="336" width="18" height="14" class="cell c3"/><rect x="360" width="18" height="14" class="cell c1"/><rect x="384" width="18" height="14" class="cell c3"/><rect x="408" width="18" height="14" class="cell c4"/><rect x="432" width="18" height="14" class="cell c5"/><rect x="456" width="18" height="14" class="cell c3"/><rect x="480" width="18" height="14" class="cell c2"/><rect x="504" width="18" height="14" class="cell c5"/><rect x="528" width="18" height="14" class="cell c4"/><rect x="552" width="18" height="14" class="cell c2"/><rect x="576" width="18" height="14" class="cell c5"/><rect x="600" width="18" height="14" class="cell c3"/><rect x="624" width="18" height="14" class="cell c4"/><rect x="648" width="18" height="14" class="cell c5"/><rect x="672" width="18" height="14" class="cell c3"/><rect x="696" width="18" height="14" class="cell c5"/><rect x="720" width="18" height="14" class="cell c4"/><rect x="744" width="18" height="14" class="cell c5"/><rect x="768" width="18" height="14" class="cell c3"/><rect x="792" width="18" height="14" class="cell c4"/>
    </g>
    <!-- Row 3 -->
    <g transform="translate(0, 36)">
      <rect x="0" width="18" height="14" class="cell c0"/><rect x="24" width="18" height="14" class="cell c3"/><rect x="48" width="18" height="14" class="cell c5"/><rect x="72" width="18" height="14" class="cell c4"/><rect x="96" width="18" height="14" class="cell c2"/><rect x="120" width="18" height="14" class="cell c0"/><rect x="144" width="18" height="14" class="cell c4"/><rect x="168" width="18" height="14" class="cell c3"/><rect x="192" width="18" height="14" class="cell c5"/><rect x="216" width="18" height="14" class="cell c4"/><rect x="240" width="18" height="14" class="cell c2"/><rect x="264" width="18" height="14" class="cell c3"/><rect x="288" width="18" height="14" class="cell c1"/><rect x="312" width="18" height="14" class="cell c4"/><rect x="336" width="18" height="14" class="cell c5"/><rect x="360" width="18" height="14" class="cell c4"/><rect x="384" width="18" height="14" class="cell c2"/><rect x="408" width="18" height="14" class="cell c3"/><rect x="432" width="18" height="14" class="cell c4"/><rect x="456" width="18" height="14" class="cell c5"/><rect x="480" width="18" height="14" class="cell c4"/><rect x="504" width="18" height="14" class="cell c3"/><rect x="528" width="18" height="14" class="cell c1"/><rect x="552" width="18" height="14" class="cell c4"/><rect x="576" width="18" height="14" class="cell c3"/><rect x="600" width="18" height="14" class="cell c5"/><rect x="624" width="18" height="14" class="cell c3"/><rect x="648" width="18" height="14" class="cell c4"/><rect x="672" width="18" height="14" class="cell c5"/><rect x="696" width="18" height="14" class="cell c3"/><rect x="720" width="18" height="14" class="cell c5"/><rect x="744" width="18" height="14" class="cell c4"/><rect x="768" width="18" height="14" class="cell c5"/><rect x="792" width="18" height="14" class="cell c5"/>
    </g>
    <!-- Row 4 -->
    <g transform="translate(0, 54)">
      <rect x="0" width="18" height="14" class="cell c3"/><rect x="24" width="18" height="14" class="cell c1"/><rect x="48" width="18" height="14" class="cell c2"/><rect x="72" width="18" height="14" class="cell c5"/><rect x="96" width="18" height="14" class="cell c3"/><rect x="120" width="18" height="14" class="cell c4"/><rect x="144" width="18" height="14" class="cell c5"/><rect x="168" width="18" height="14" class="cell c2"/><rect x="192" width="18" height="14" class="cell c4"/><rect x="216" width="18" height="14" class="cell c1"/><rect x="240" width="18" height="14" class="cell c3"/><rect x="264" width="18" height="14" class="cell c5"/><rect x="288" width="18" height="14" class="cell c3"/><rect x="312" width="18" height="14" class="cell c2"/><rect x="336" width="18" height="14" class="cell c4"/><rect x="360" width="18" height="14" class="cell c5"/><rect x="384" width="18" height="14" class="cell c5"/><rect x="408" width="18" height="14" class="cell c2"/><rect x="432" width="18" height="14" class="cell c1"/><rect x="456" width="18" height="14" class="cell c4"/><rect x="480" width="18" height="14" class="cell c5"/><rect x="504" width="18" height="14" class="cell c4"/><rect x="528" width="18" height="14" class="cell c3"/><rect x="552" width="18" height="14" class="cell c5"/><rect x="576" width="18" height="14" class="cell c4"/><rect x="600" width="18" height="14" class="cell c2"/><rect x="624" width="18" height="14" class="cell c5"/><rect x="648" width="18" height="14" class="cell c4"/><rect x="672" width="18" height="14" class="cell c2"/><rect x="696" width="18" height="14" class="cell c4"/><rect x="720" width="18" height="14" class="cell c3"/><rect x="744" width="18" height="14" class="cell c5"/><rect x="768" width="18" height="14" class="cell c4"/><rect x="792" width="18" height="14" class="cell c5"/>
    </g>
    <!-- Row 5 -->
    <g transform="translate(0, 72)">
      <rect x="0" width="18" height="14" class="cell c1"/><rect x="24" width="18" height="14" class="cell c3"/><rect x="48" width="18" height="14" class="cell c4"/><rect x="72" width="18" height="14" class="cell c2"/><rect x="96" width="18" height="14" class="cell c1"/><rect x="120" width="18" height="14" class="cell c3"/><rect x="144" width="18" height="14" class="cell c2"/><rect x="168" width="18" height="14" class="cell c5"/><rect x="192" width="18" height="14" class="cell c3"/><rect x="216" width="18" height="14" class="cell c5"/><rect x="240" width="18" height="14" class="cell c4"/><rect x="264" width="18" height="14" class="cell c1"/><rect x="288" width="18" height="14" class="cell c4"/><rect x="312" width="18" height="14" class="cell c5"/><rect x="336" width="18" height="14" class="cell c2"/><rect x="360" width="18" height="14" class="cell c3"/><rect x="384" width="18" height="14" class="cell c1"/><rect x="408" width="18" height="14" class="cell c5"/><rect x="432" width="18" height="14" class="cell c3"/><rect x="456" width="18" height="14" class="cell c2"/><rect x="480" width="18" height="14" class="cell c3"/><rect x="504" width="18" height="14" class="cell c5"/><rect x="528" width="18" height="14" class="cell c4"/><rect x="552" width="18" height="14" class="cell c3"/><rect x="576" width="18" height="14" class="cell c2"/><rect x="600" width="18" height="14" class="cell c4"/><rect x="624" width="18" height="14" class="cell c3"/><rect x="648" width="18" height="14" class="cell c5"/><rect x="672" width="18" height="14" class="cell c4"/><rect x="696" width="18" height="14" class="cell c3"/><rect x="720" width="18" height="14" class="cell c5"/><rect x="744" width="18" height="14" class="cell c4"/><rect x="768" width="18" height="14" class="cell c5"/><rect x="792" width="18" height="14" class="cell c4"/>
    </g>
  </g>

  <!-- Animated Neon Cyber-Snake Gliding Across the Contribution Grid -->
  <use href="#snakePath" stroke="url(#waveStroke)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="snake-beam" filter="url(#neon)"/>

  <!-- Sweeping Vertical Purple Laser Scanner Bar -->
  <g>
    <rect x="40" y="145" width="3" height="96" fill="#C084FC" filter="url(#neon)" opacity="0.85">
      <animate attributeName="x" values="40;850;40" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="145" width="28" height="96" fill="url(#laserGrad)" opacity="0.3">
      <animate attributeName="x" values="28;838;28" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Footer Legend & Equalizer -->
  <text x="40" y="282" class="hud-sub">// NEON CONTRIBUTION SPECTRUM</text>
  <g transform="translate(680, 271)">
    <text x="0" y="11" class="hud-sub" style="fill:#71717A;">LESS</text>
    <rect x="38" y="0" width="12" height="12" rx="2.5" fill="#12111A"/>
    <rect x="54" y="0" width="12" height="12" rx="2.5" fill="#2E1F5E"/>
    <rect x="70" y="0" width="12" height="12" rx="2.5" fill="#4F46E5"/>
    <rect x="86" y="0" width="12" height="12" rx="2.5" fill="#7C3AED"/>
    <rect x="102" y="0" width="12" height="12" rx="2.5" fill="#A855F7"/>
    <rect x="118" y="0" width="12" height="12" rx="2.5" fill="#38BDF8"/>
    <text x="138" y="11" class="hud-sub" style="fill:#38BDF8;">MAX</text>
  </g>
</svg>
