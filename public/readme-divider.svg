<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="100%" height="28">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050507" stop-opacity="0"/>
      <stop offset="20%" stop-color="#4F46E5" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowLine" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="20" y1="14" x2="880" y2="14" stroke="url(#lineGrad)" stroke-width="1.5" filter="url(#glowLine)"/>

  <!-- Traveling Energy Pulse 1 -->
  <circle cy="14" r="3.5" fill="#C084FC" filter="url(#glowLine)">
    <animate attributeName="cx" values="60;840;60" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Traveling Energy Pulse 2 -->
  <circle cy="14" r="3" fill="#38BDF8" filter="url(#glowLine)">
    <animate attributeName="cx" values="840;60;840" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Center Diamond Node -->
  <polygon points="450,8 456,14 450,20 444,14" fill="#050507" stroke="#a855f7" stroke-width="1.5" filter="url(#glowLine)">
    <animateTransform attributeName="transform" type="rotate" from="0 450 14" to="360 450 14" dur="6s" repeatCount="indefinite"/>
  </polygon>
</svg>
